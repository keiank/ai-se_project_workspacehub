name: CI

on:
  push:
  pull_request:

jobs:
  validate-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@4

      - uses: actions/setup-node@4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build --workspace server

  validate-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@4

      - uses: actions/setup-node@4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace client

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@4

      - uses: actions/setup-node@4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@4

      - uses: actions/setup-node@4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test --workspace client